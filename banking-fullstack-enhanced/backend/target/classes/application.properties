# Transaction OTP
# ===============================

otp.expiration-minutes=5
otp.max-attempts=5
otp.resend-cooldown-seconds=30
# ===============================

# Cookie Security

# ===============================

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
