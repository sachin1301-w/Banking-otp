# ===============================

# Application

# ===============================

spring.application.name=banking-backend

# ===============================

# Server

# ===============================

server.port=${SERVER_PORT:8080}

# ===============================

# PostgreSQL Database

# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bankdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Sachin1301#}
spring.datasource.driver-class-name=org.postgresql.Driver
app.cors.allowed-origins=http://localhost:5173
# ===============================

# JPA / Hibernate

# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================

# Logging

# ===============================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===============================

# Jackson

# ===============================

spring.jackson.serialization.fail-on-empty-beans=false

# ===============================

# Error Response

# ===============================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ===============================

# JWT

# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ===============================

# Admin

# ===============================

admin.bootstrap.enabled=false
admin.default.email=${ADMIN_EMAIL:sach34861301@gmail.com}
admin.default.password=${ADMIN_PASSWORD:Sachin1301#}

